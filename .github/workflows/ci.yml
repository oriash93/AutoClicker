name: AutoClicker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore AutoClicker.Tests/AutoClicker.Tests.csproj
    - name: Build
      run: dotnet build --no-restore AutoClicker.Tests/AutoClicker.Tests.csproj
    - name: Test
      run: dotnet test --no-build --project AutoClicker.Tests/AutoClicker.Tests.csproj
